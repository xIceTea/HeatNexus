<rect x="72" y="142" width="44" height="10" rx="5" fill="#f2f6fa" opacity="0.25"/>
<circle cx="140" cy="147" r="4" fill="#e2543a" opacity="0.8"/>

<!-- Wärmetauscher: senkrechte Rauchrohre -->
<g fill="#1d242c" opacity="0.8">
  <rect x="70" y="172" width="9" height="46" rx="4"/>
  <rect x="88" y="172" width="9" height="46" rx="4"/>

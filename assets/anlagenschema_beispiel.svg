<rect x="72" y="244" width="72" height="30" rx="6" fill="url(#t0-glutbett)"/>
<rect x="72" y="268" width="72" height="6" rx="3" fill="#e2543a"/><text x="100" y="374" text-anchor="middle" fill="#f2f6fa" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Roboto, sans-serif">PuroWIN</text></g><g transform="translate(224,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t1-schichtung" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#b3341f"/>
    <stop offset="30%" stop-color="#b3341f"/>
    <stop offset="62%" stop-color="#25508f" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#25508f"/>
  </linearGradient>
  <linearGradient id="t1-glanz" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
    <stop offset="26%" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="78%" stop-color="#000000" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
  </linearGradient>
</defs>

<!-- Speicherkörper mit Schichtung von oben warm nach unten kalt -->
<rect x="42" y="116" width="116" height="180" rx="30" fill="url(#t1-schichtung)"/>
<rect x="42" y="116" width="116" height="180" rx="30" fill="url(#t1-glanz)"/>
<rect x="42" y="116" width="116" height="180" rx="30" fill="none"
      stroke="#4a5561" stroke-width="2"/>

<!-- Schichtgrenzen: der Speicher ist keine gleichmäßige Masse -->
<g stroke="#ffffff" stroke-width="1" opacity="0.13">
  <line x1="50" y1="168" x2="150" y2="168"/>
  <line x1="50" y1="206" x2="150" y2="206"/>
  <line x1="50" y1="244" x2="150" y2="244"/>
</g>

<!-- Isolierungsband oben und unten -->
<g fill="#1d242c" opacity="0.5">
  <rect x="44" y="132" width="112" height="7" rx="3"/>
  <rect x="44" y="274" width="112" height="7" rx="3"/>
</g>

<!-- Fühlerpunkte TPE (oben) und TPA (unten) -->
<g fill="#f2f6fa" opacity="0.45">
  <circle cx="152" cy="150" r="3"/>
  <circle cx="152" cy="264" r="3"/>
</g><text x="100" y="374" text-anchor="middle" fill="#f2f6fa" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Roboto, sans-serif">B-PLMi PUFFER</text></g><g transform="translate(424,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t2-waerme" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e2543a"/>
    <stop offset="100%" stop-color="#b3341f"/>
  </linearGradient>
</defs>

<!-- Heizkörper: Sammelrohre oben und unten, Glieder dazwischen -->
<rect x="42" y="132" width="116" height="12" rx="6" fill="#2b333c"
      stroke="#4a5561" stroke-width="1.5"/>
<rect x="42" y="266" width="116" height="12" rx="6" fill="#2b333c"
      stroke="#4a5561" stroke-width="1.5"/>

<g fill="url(#t2-waerme)" stroke="#4a5561" stroke-width="1">
  <rect x="50" y="140" width="14" height="132" rx="7"/>
  <rect x="72" y="140" width="14" height="132" rx="7"/>
  <rect x="94" y="140" width="14" height="132" rx="7"/>
  <rect x="116" y="140" width="14" height="132" rx="7"/>
  <rect x="138" y="140" width="14" height="132" rx="7"/>
</g>

<!-- Glanzkante, damit die Glieder rund wirken -->
<g fill="#ffffff" opacity="0.16">
  <rect x="53" y="146" width="4" height="120" rx="2"/>
  <rect x="75" y="146" width="4" height="120" rx="2"/>
  <rect x="97" y="146" width="4" height="120" rx="2"/>
  <rect x="119" y="146" width="4" height="120" rx="2"/>
  <rect x="141" y="146" width="4" height="120" rx="2"/>
</g>

<!-- Mischer im Vorlauf: das Stellglied des Kreises -->
<circle cx="100" cy="112" r="11" fill="#1d242c" stroke="#4a5561" stroke-width="1.5"/>
<path d="M 94 112 L 106 112 M 100 106 L 100 118" stroke="#f2f6fa" stroke-width="2"
      opacity="0.6" stroke-linecap="round"/><text x="100" y="374" text-anchor="middle" fill="#f2f6fa" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Roboto, sans-serif">UMLZ HEIZKREIS</text></g><g transform="translate(624,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t3-boiler" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#b3341f"/>
    <stop offset="70%" stop-color="#b3341f" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#25508f" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="t3-glanz" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="28%" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
  </linearGradient>
</defs>

<!-- Speicherkörper, oben und unten gewölbt -->
<rect x="48" y="124" width="104" height="168" rx="48" fill="url(#t3-boiler)"/>
<rect x="48" y="124" width="104" height="168" rx="48" fill="url(#t3-glanz)"/>
<rect x="48" y="124" width="104" height="168" rx="48" fill="none"
      stroke="#4a5561" stroke-width="2"/>


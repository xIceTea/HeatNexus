<g fill="#f2f6fa" opacity="0.4">
  <path d="M 100 212 L 124 204 A 25 25 0 0 0 108 192 Z"/>
  <path d="M 100 212 L 92 236 A 25 25 0 0 0 116 230 Z"/>
  <path d="M 100 212 L 78 199 A 25 25 0 0 0 78 226 Z"/>
</g>
<circle cx="100" cy="212" r="5" fill="#4a5561"/>

<!-- Betriebslampe -->
<circle cx="136" cy="252" r="4" fill="#e2543a" opacity="0.75"/>


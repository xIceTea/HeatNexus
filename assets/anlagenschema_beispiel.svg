<path d="M 70 176 h 60 M 70 176 a 8 8 0 0 1 0 16 h 60 a 8 8 0 0 1 0 16 h -60
         a 8 8 0 0 1 0 16 h 60 a 8 8 0 0 1 0 16 h -60"
      fill="none" stroke="#f2f6fa" stroke-width="3" opacity="0.3"
      stroke-linecap="round"/>

<!-- Wassertropfen als Merkzeichen -->
<path d="M 100 138 q 11 14 11 21 a 11 11 0 0 1 -22 0 q 0 -7 11 -21 Z"
      fill="#f2f6fa" opacity="0.35"/><text x="100" y="374" text-anchor="middle" fill="#f2f6fa" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Roboto, sans-serif">Warmwasser</text></g><g transform="translate(824,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t4-ring" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b444e"/>
    <stop offset="100%" stop-color="#1d242c"/>
  </linearGradient>
</defs>


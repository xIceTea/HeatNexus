  <rect x="124" y="172" width="9" height="46" rx="4"/>
  <rect x="142" y="172" width="9" height="46" rx="4"/>
</g>

<!-- Brennraum mit Glutbett -->
<rect x="64" y="230" width="88" height="52" rx="8" fill="#1d242c"

  <path d="M 100 206 L 92 222 A 17 17 0 0 0 108 219 Z"/>
  <path d="M 100 206 L 85 196 A 17 17 0 0 0 85 214 Z"/>
</g><text x="100" y="374" text-anchor="middle" fill="#f2f6fa" font-size="15" font-weight="600" font-family="system-ui, -apple-system, Roboto, sans-serif">Zirkulation</text></g><g transform="translate(1024,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t5-gehaeuse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b444e"/>
    <stop offset="100%" stop-color="#1d242c"/>
  </linearGradient>
</defs>

<!-- ZSP: ein Modul in der Leitung, kein eigener Kreis. Es sitzt zwischen
     Vor- und Rücklauf und regelt eine Pumpe bzw. schaltet ein Relais. -->
<rect x="52" y="150" width="96" height="116" rx="12" fill="url(#t5-gehaeuse)"
      stroke="#4a5561" stroke-width="2"/>

<!-- Klemmleiste oben: das Modul ist ein Schaltgerät -->
<g fill="#1d242c">
  <rect x="62" y="158" width="76" height="12" rx="4"/>
</g>
<g fill="#4a5561">
  <circle cx="74" cy="164" r="2.5"/>
  <circle cx="88" cy="164" r="2.5"/>
  <circle cx="102" cy="164" r="2.5"/>
  <circle cx="116" cy="164" r="2.5"/>
  <circle cx="130" cy="164" r="2.5"/>
</g>

<!-- Pumpe als Kreis mit Laufrad, wie im Hydraulikplan -->
<circle cx="100" cy="212" r="26" fill="#1d242c" stroke="#4a5561"

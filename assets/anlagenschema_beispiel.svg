<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 392" width="1248" height="392"><rect width="100%" height="100%" rx="16" fill="#151d26"/><rect x="24" y="89" width="1200" height="6" rx="3" fill="#e2543a" opacity="0.85"/><rect x="24" y="315" width="1200" height="6" rx="3" fill="#3a7fe2" opacity="0.85"/><g transform="translate(24,0)"><rect x="98" y="92" width="4" height="30" fill="#e2543a" opacity="0.7"/><rect x="98" y="288" width="4" height="30" fill="#3a7fe2" opacity="0.7"/><defs>
  <linearGradient id="t0-gehaeuse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3b444e"/>
    <stop offset="100%" stop-color="#1d242c"/>
  </linearGradient>
  <linearGradient id="t0-glutbett" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#e2543a"/>
    <stop offset="55%" stop-color="#e2543a" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#e2543a" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Einschub der Stokerschnecke, von links unten in den Brennraum -->
<g stroke="#4a5561" stroke-width="2" fill="#2b333c">
  <path d="M 22 290 L 22 262 L 54 240 L 54 274 Z"/>
</g>
<g stroke="#f2f6fa" stroke-width="1.5" opacity="0.25" fill="none">
  <path d="M 28 284 L 48 270"/>
  <path d="M 28 274 L 48 260"/>
</g>

<!-- Kesselkörper -->
<rect x="52" y="120" width="112" height="174" rx="14" fill="url(#t0-gehaeuse)"
      stroke="#4a5561" stroke-width="2"/>

<!-- Bedienteil -->
<rect x="64" y="134" width="88" height="26" rx="6" fill="#1d242c"

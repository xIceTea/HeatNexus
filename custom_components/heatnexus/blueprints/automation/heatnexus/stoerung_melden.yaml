blueprint:
  name: HeatNexus – Störung melden
  description: >
    Meldet sich, sobald die Anlage eine Störung anzeigt, wiederholt die Meldung
    auf Wunsch in einem festen Abstand und meldet die Entwarnung.

    Ausgewertet wird der Sensor **Störung gemeldet**, nicht der angezeigte
    Text. Damit hängt die Automation nicht an einer Formulierung und läuft
    auch bei mehreren gleichzeitigen Störungen richtig.

    Jeder Anlagenteil hat einen eigenen Sensor dieser Art (Kessel, Heizkreis,
    Puffer, Zirkulation). Für den Kessel genügt meist einer.
  domain: automation
  author: HeatNexus
  source_url: https://github.com/xIceTea/HeatNexus/blob/main/custom_components/heatnexus/blueprints/automation/heatnexus/stoerung_melden.yaml
  input:
    meldung:
      name: Störung
      description: Der Sensor „Störung gemeldet" des Anlagenteils.
      selector:
        entity:
          filter:
            - integration: heatnexus
              domain: binary_sensor
              device_class: problem
    aktion_stoerung:
      name: Bei Störung
      description: >
        Der Störungstext steht als `stoerungstext` bereit, die Zahl der
        anstehenden Meldungen als `anzahl`, der Name des Anlagenteils als
        `anlagenteil`.
      selector:
        action: {}
    erinnern:
      name: Erinnern, solange die Störung ansteht
      default: true
      selector:
        boolean: {}
    abstand:
      name: Abstand der Erinnerungen
      default:
        hours: 24
      selector:
        duration: {}
    aktion_erinnerung:
      name: Bei Erinnerung
      description: >
        Meist dieselbe Benachrichtigung wie oben, mit anderem Text. Bleibt das
        leer, passiert bei der Erinnerung nichts.
      default: []
      selector:
        action: {}
    aktion_entwarnung:
      name: Bei Entwarnung
      description: Bleibt das leer, wird keine Entwarnung gemeldet.
      default: []
      selector:
        action: {}

# restart: Eine neue Störung beendet die Erinnerungsschleife der alten.
mode: restart

triggers:
  # Nur der Zustandswechsel, nicht jede Änderung an den Attributen: sonst löst
  # jeder Abruf die Meldung neu aus.
  - trigger: state
    entity_id: !input meldung
    to:
      - "on"
      - "off"
  # Für den Klartext-Sensor, der den Zustand im Attribut führt.
  - trigger: state
    entity_id: !input meldung
    attribute: stoerung_aktiv
  - trigger: homeassistant
    event: start

variables:
  sensor: !input meldung
  soll_erinnern: !input erinnern
  # Der Störungssensor meldet an/aus. Wer noch den Klartext-Sensor eingetragen
  # hat, wird über dessen Attribut ausgewertet – die Automation läuft weiter.
  stoerung: "{{ state_attr(sensor, 'stoerung_aktiv') or is_state(sensor, 'on') }}"
  anzahl: "{{ state_attr(sensor, 'anzahl') | default(0, true) }}"
  stoerungstext: "{{ state_attr(sensor, 'stoerungstext') or states(sensor) }}"
  anlagenteil: "{{ device_attr(sensor, 'name_by_user') or device_attr(sensor, 'name') or '' }}"

conditions:
  - condition: template
    value_template: "{{ states(sensor) not in ['unknown', 'unavailable'] }}"
  # Die Entwarnung meldet der Durchlauf, der auf sie wartet; ein Durchlauf
  # ohne anstehende Störung hat nichts zu tun.
  - condition: template
    value_template: "{{ stoerung }}"

actions:
  - sequence: !input aktion_stoerung
  - repeat:
      sequence:
        - wait_template: >-
            {{ not (state_attr(sensor, 'stoerung_aktiv') or is_state(sensor, 'on')) }}
          timeout: !input abstand
        # Nicht erfüllt heißt: die Wartezeit ist abgelaufen und die Störung
        # steht immer noch an.
        - if:
            - condition: template
              value_template: "{{ soll_erinnern and not wait.completed }}"
          then: !input aktion_erinnerung
      # Verlassen wird die Schleife erst mit der Entwarnung – auch ohne
      # Erinnerungen, sonst käme die Entwarnung zu spät.
      until:
        - condition: template
          value_template: "{{ wait.completed }}"
  - sequence: !input aktion_entwarnung

# Qualitätsstufe nach dem Raster von Home Assistant.
#
# Die Datei ist eine **ehrliche Selbstauskunft**, keine Auszeichnung: Sie sagt,
# welche Regeln HeatNexus erfüllt, welche noch offen sind und welche für eine
# Integration wie diese nicht gelten. Wer wissen will, wo das Projekt steht,
# liest hier – und wer daran arbeitet, findet die nächste Aufgabe.
#
# status: done | todo | exempt (mit Begründung)

rules:
  # ---------------------------------------------------------------- Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: Der Einrichtungsdialog ist geprüft, aber nicht vollständig.
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: HeatNexus bringt keine eigenen Auslöser mit.
  docs-conditions:
    status: exempt
    comment: HeatNexus bringt keine eigenen Bedingungen mit.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ---------------------------------------------------------------- Silber
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Die Tests decken weniger als die verlangten 95 Prozent des Codes ab.

  # ------------------------------------------------------------------ Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: >-
      Die InfoWIN Touch meldet sich per mDNS (`_workstation._tcp`, Name
      `mb6620…`) und per DHCP an. Home Assistant bietet sie zur Einrichtung an.
  discovery-update-info:
    status: done
    comment: >-
      Schweigt eine Steuerung, fragt ein Fund, ob sie umgezogen ist. Nach der
      Bestätigung zieht der Eintrag um, wenn ihre Seriennummer passt.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Im langsamen Takt vergleicht HeatNexus den Aufbau der Anlage mit dem
      Erkennungsstand. Kommt ein Anlagenteil dazu, liest es die Anlage im
      Hintergrund neu ein; neue Geräte erscheinen ohne Neustart.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: >-
      Die Namen kommen in der gewählten Sprache aus der Geräte-Datenbank, nicht
      aus Übersetzungsschlüsseln. Nur die Entitäten der Automatik tragen einen
      Übersetzungsschlüssel.
  exception-translations: done
  icon-translations:
    status: todo
    comment: Symbole werden je Entität gesetzt statt über icons.json.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      Verschwundene Datenpunkte werden stillgelegt, aber nicht entfernt, damit
      Verlauf und Benennung erhalten bleiben. Ein Gerät, an dem nach dem
      Vollabzug nichts Gemeldetes mehr hängt, lässt sich in Home Assistant
      löschen.

  # --------------------------------------------------------------- Platin
  async-dependency:
    status: exempt
    comment: >-
      HeatNexus hat keine Abhängigkeiten (requirements ist leer); der
      HTTP-Zugriff läuft direkt über aiohttp.
  inject-websession:
    status: todo
    comment: >-
      Die Sitzung wird selbst angelegt, weil sie eine eigene
      Digest-Anmeldung und einen eigenen, engen Verbindungspool braucht.
      Über async_create_clientsession ginge beides ebenfalls.
  strict-typing:
    status: todo
    comment: Typangaben sind verbreitet, aber nicht vollständig.

rediscover:
  name: Anlage neu erkennen
  description: >-
    Verwirft den gespeicherten Erkennungsstand und liest die Anlage komplett neu
    ein (Datenpunkte und Geräte). Das ist zum Beispiel nach Umbauten an der
    Heizung nötig oder wenn neue Heizkreise hinzugekommen sind. Der Lauf dauert
    einmalig länger und meldet danach je Anlage, wie viele Entitäten, zyklisch
    abgefragte Datenpunkte und Zeitprogramme gefunden wurden.

set_current_temp_compensation:
  name: Behaglichkeitskorrektur setzen
  description: >-
    Verschiebt die gemessene Raumtemperatur eines Heizkreises um einen festen
    Betrag. Gedacht für Fühler, die dauerhaft zu warm oder zu kalt messen, weil
    sie ungünstig hängen.
  target:
    entity:
      integration: heatnexus
      domain: climate
  fields:
    compensation:
      name: Korrektur
      description: Wird auf die gemessene Raumtemperatur aufgeschlagen.
      required: true
      selector:
        number:
          min: -3.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "K"

meldungen_loeschen:
  name: Meldungsliste leeren
  description: >-
    Leert die Meldungsliste eines Geräts. Führt die Steuerung einen
    Störspeicher, löscht der Dienst dort die Einträge dieses Geräts, deren
    Störung nicht mehr anliegt. Sonst leert er nur die Liste in Home Assistant.
  target:
    entity:
      integration: heatnexus
      domain: sensor

stoerung_quittieren:
  name: Störung quittieren
  description: >-
    Markiert einen Eintrag im Störspeicher der Steuerung als gelesen. Am
    Bediengerät schließt sich die Meldung. Die Störung am Kessel bleibt bestehen.
  target:
    entity:
      integration: heatnexus
      domain: sensor
  fields:
    eintrag: &eintrag
      name: Eintrag
      description: >-
        Nummer des Eintrags im Störspeicher, wie sie im Attribut „eintraege“
        des Sensors Störspeicher steht.
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box

stoerung_zuruecksetzen:
  name: Störung zurücksetzen
  description: >-
    Setzt eine anliegende Störung zurück wie die Taste am Bediengerät.
    Steuerungen ab Fassung 2 heben damit die Störung am Kessel auf. Dafür muss
    in den Optionen „Störungen am Kessel zurücksetzen erlauben“ eingeschaltet sein.
  target:
    entity:
      integration: heatnexus
      domain: sensor
  fields:
    eintrag: *eintrag

stoerung_loeschen:
  name: Meldung löschen
  description: >-
    Nimmt einen Eintrag aus dem Störspeicher der Steuerung. Löschen lassen sich
    nur Einträge, deren Störung nicht mehr anliegt.
  target:
    entity:
      integration: heatnexus
      domain: sensor
  fields:
    eintrag: *eintrag

set_vorgabe:
  name: Befristete Vorgabe setzen
  description: >-
    Setzt für einen Heizkreis eine befristete Raumtemperatur-Vorgabe – dieselbe,
    die die Anlage „Eco / Comfort“ nennt. Danach kehrt der Heizkreis von selbst
    zur Betriebswahl zurück; die Zeitprogramme bleiben unverändert. Steht der
    Kreis auf Standby oder WW-Betrieb, schaltet er für die Dauer der Vorgabe in
    ein Heizprogramm und danach zurück.
  target:
    entity:
      integration: heatnexus
      domain: climate
  fields:
    temperature:
      name: Temperatur
      description: Raumtemperatur, die während der Vorgabe gilt.
      required: true
      example: 21.5
      selector:
        number:
          min: 10.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Dauer
      description: >-
        Wie lange die Vorgabe gilt. 0 beendet eine laufende Vorgabe sofort.
      example: 180
      selector:
        number:
          min: 0
          max: 400
          step: 5
          unit_of_measurement: "min"

set_time_program:
  name: Zeitprogramm setzen
  description: >-
    Schreibt ein Heiz- oder Warmwasser-Zeitprogramm. Ziel ist ein
    Zeitprogramm-Sensor von HeatNexus. Für ein Programm, das täglich oder an
    bestimmten Tagen gilt, genügen Schaltpunkte und Wochentage. Mehrere
    Wochentag-Gruppen wie Mo–Fr und Sa–So lassen sich über Blöcke schreiben.
  target:
    entity:
      integration: heatnexus
      domain: sensor
  fields:
    switch_points:
      name: Schaltpunkte
      description: >-
        Liste von Schaltpunkten {time, value}. time im Format HH:MM, value =
        Soll-Temperatur. Gilt für den Block aus weekdays.
      example: '[{"time": "06:00", "value": 21}, {"time": "22:00", "value": 18}]'
      selector:
        object:
    weekdays:
      name: Wochentage
      description: >-
        Wochentage für die Schaltpunkte (Mo Di Mi Do Fr Sa So oder
        Mo Tu We Th Fr Sa Su). Standard: täglich.
      example: '["Mo", "Di", "Mi", "Do", "Fr"]'
      selector:
        object:
    blocks:
      name: Blöcke (erweitert)
      description: >-
        Volle Programmstruktur als Liste von Blöcken, je Block mit weekdays und
        switch_points. Überschreibt switch_points/weekdays, wenn angegeben.
      example: >-
        [{"weekdays": ["Mo","Di","Mi","Do","Fr"], "switch_points":
        [{"time":"06:00","value":21},{"time":"22:00","value":18}]},
        {"weekdays": ["Sa","So"], "switch_points":
        [{"time":"07:00","value":21},{"time":"23:00","value":18}]}]
      selector:
        object:

dashboard_ausgeben:
  name: Dashboard als YAML ausgeben
  description: >-
    Gibt das mitgelieferte Dashboard als YAML-Text zurück. Es wird bei jedem
    Öffnen neu gebaut und lässt sich deshalb nicht bearbeiten – mit diesem Text
    legst du ein eigenes Dashboard an, das dir gehört: neues Dashboard
    anlegen, Rohkonfigurations-Editor öffnen, Text einfügen.

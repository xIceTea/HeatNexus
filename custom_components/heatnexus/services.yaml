rediscover:
  name: Anlage neu erkennen
  description: >-
    Verwirft den gespeicherten Erkennungsstand und liest die Anlage komplett neu
    ein (Datenpunkte/Geräte). Nötig z.B. nach Umbauten an der Heizung oder wenn
    neue Heizkreise hinzugekommen sind. Dauert einmalig etwas länger und meldet
    danach je Anlage zurück, wie viele Entitäten, zyklisch abgefragte
    Datenpunkte und Zeitprogramme gefunden wurden.

set_current_temp_compensation:
  name: Behaglichkeitskorrektur setzen
  description: >-
    Verschiebt die gemessene Raumtemperatur eines Heizkreises um einen festen
    Betrag. Gedacht für Fühler, die dauerhaft zu warm oder zu kalt messen, weil
    sie ungünstig hängen.
  target:
    entity:
      integration: heatnexus
      domain: climate
  fields:
    compensation:
      name: Korrektur
      description: Wird auf die gemessene Raumtemperatur aufgeschlagen.
      required: true
      selector:
        number:
          min: -3.0
          max: 3.0
          step: 0.1
          unit_of_measurement: "K"

meldungen_loeschen:
  name: Meldungsliste leeren
  description: >-
    Leert die von HeatNexus geführte Meldungsliste einer Anlage. Die Anlage
    selbst führt diese Liste nicht über ihre Schnittstelle – gelöscht wird
    also nur die Sammlung in Home Assistant, nicht der Störspeicher am
    Bediengerät. Dort anstehende Meldungen bleiben unberührt und müssen wie
    gewohnt am Gerät zurückgesetzt werden.
  target:
    entity:
      integration: heatnexus
      domain: sensor

set_vorgabe:
  name: Befristete Vorgabe setzen
  description: >-
    Setzt für einen Heizkreis eine befristete Raumtemperatur-Vorgabe – dieselbe,
    die die Anlage „Eco / Comfort" nennt. Danach stellt sie von selbst auf die
    Betriebswahl zurück; die Zeitprogramme bleiben unverändert. Steht der Kreis
    auf Standby oder WW-Betrieb, wird für die Dauer der Vorgabe in ein
    Heizprogramm geschaltet und anschließend zurückgesprungen.
  target:
    entity:
      integration: heatnexus
      domain: climate
  fields:
    temperature:
      name: Temperatur
      description: Raumtemperatur, die während der Vorgabe gilt.
      required: true
      example: 21.5
      selector:
        number:
          min: 10.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Dauer
      description: >-
        Wie lange die Vorgabe gilt. 0 beendet eine laufende Vorgabe sofort.
      example: 180
      selector:
        number:
          min: 0
          max: 400
          step: 5
          unit_of_measurement: "min"

set_time_program:
  name: Zeitprogramm setzen
  description: >-
    Schreibt ein Heiz-/Warmwasser-Zeitprogramm (Ziel: ein Zeitprogramm-Sensor
    der Windhager-Integration). Entweder vereinfacht über switch_points
    (+ optional weekdays, Standard täglich) oder über blocks für volle Kontrolle
    (mehrere Wochentag-Gruppen, z.B. Mo-Fr und Sa-So).
  target:
    entity:
      integration: heatnexus
      domain: sensor
  fields:
    switch_points:
      name: Schaltpunkte
      description: >-
        Liste von Schaltpunkten {time, value}. time im Format HH:MM, value =
        Soll-Temperatur. Gilt für den Block aus weekdays.
      example: '[{"time": "06:00", "value": 21}, {"time": "22:00", "value": 18}]'
      selector:
        object:
    weekdays:
      name: Wochentage
      description: >-
        Wochentage für die Schaltpunkte (Mo Di Mi Do Fr Sa So oder
        Mo Tu We Th Fr Sa Su). Standard: täglich.
      example: '["Mo", "Di", "Mi", "Do", "Fr"]'
      selector:
        object:
    blocks:
      name: Blöcke (erweitert)
      description: >-
        Volle Programmstruktur als Liste von Blöcken, je Block mit weekdays und
        switch_points. Überschreibt switch_points/weekdays, wenn angegeben.
      example: >-
        [{"weekdays": ["Mo","Di","Mi","Do","Fr"], "switch_points":
        [{"time":"06:00","value":21},{"time":"22:00","value":18}]},
        {"weekdays": ["Sa","So"], "switch_points":
        [{"time":"07:00","value":21},{"time":"23:00","value":18}]}]
      selector:
        object:

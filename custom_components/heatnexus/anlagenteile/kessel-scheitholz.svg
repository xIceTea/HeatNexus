<defs>
  <linearGradient id="gehaeuse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="{{korpus_hell}}"/>
    <stop offset="100%" stop-color="{{korpus_dunkel}}"/>
  </linearGradient>
  <linearGradient id="glutbett" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="{{glut}}"/>
    <stop offset="60%" stop-color="{{glut}}" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="{{glut}}" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Kesselkörper -->
<rect x="38" y="120" width="124" height="174" rx="14" fill="url(#gehaeuse)"
      stroke="{{rahmen}}" stroke-width="2"/>

<!-- Bedienteil -->
<rect x="52" y="132" width="96" height="24" rx="6" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1"/>
<rect x="60" y="139" width="48" height="10" rx="5" fill="{{titel}}" opacity="0.25"/>
<circle cx="136" cy="144" r="4" fill="{{glut}}" opacity="0.8"/>

<!-- Große Fülltür mit Scheiten -->
<rect x="52" y="166" width="96" height="66" rx="8" fill="{{korpus}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>
<g fill="{{korpus_dunkel}}" stroke="{{rahmen}}" stroke-width="1.2">
  <rect x="62" y="180" width="76" height="14" rx="7"/>
  <rect x="62" y="198" width="76" height="14" rx="7"/>
  <rect x="70" y="214" width="60" height="12" rx="6"/>
</g>
<circle cx="80" cy="187" r="2.5" fill="{{rahmen}}"/>
<circle cx="120" cy="205" r="2.5" fill="{{rahmen}}"/>
<rect x="140" y="192" width="4" height="16" rx="2" fill="{{rahmen}}"/>

<!-- Ausbrandraum darunter -->
<rect x="52" y="242" width="96" height="40" rx="8" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>
<rect x="64" y="252" width="72" height="24" rx="6" fill="url(#glutbett)"/>
<rect x="64" y="270" width="72" height="6" rx="3" fill="{{glut}}"/>

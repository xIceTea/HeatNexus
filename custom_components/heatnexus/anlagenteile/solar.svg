<defs>
  <linearGradient id="kollektor" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="{{kalt}}"/>
    <stop offset="55%" stop-color="{{korpus_dunkel}}"/>
    <stop offset="100%" stop-color="{{kalt}}" stop-opacity="0.5"/>
  </linearGradient>
  <radialGradient id="sonne" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="{{glut}}"/>
    <stop offset="100%" stop-color="{{glut}}" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Sonne über dem Kollektor -->
<circle cx="150" cy="140" r="26" fill="url(#sonne)"/>
<circle cx="150" cy="140" r="11" fill="{{glut}}" opacity="0.85"/>

<!-- Kollektorfeld, leicht geneigt wie auf einem Dach -->
<g transform="rotate(-14 100 200)">
  <rect x="44" y="158" width="112" height="86" rx="6" fill="url(#kollektor)"
        stroke="{{rahmen}}" stroke-width="2"/>
  <!-- Absorberstreifen -->
  <g stroke="{{titel}}" stroke-width="2" opacity="0.22">
    <line x1="52" y1="172" x2="148" y2="172"/>
    <line x1="52" y1="186" x2="148" y2="186"/>
    <line x1="52" y1="200" x2="148" y2="200"/>
    <line x1="52" y1="214" x2="148" y2="214"/>
    <line x1="52" y1="228" x2="148" y2="228"/>
  </g>
  <!-- Lichtreflex -->
  <path d="M 46 242 L 100 160 L 118 160 L 60 242 Z" fill="#ffffff" opacity="0.07"/>
</g>

<!-- Ständer -->
<g stroke="{{rahmen}}" stroke-width="3" stroke-linecap="round">
  <line x1="66" y1="252" x2="74" y2="284"/>
  <line x1="140" y1="234" x2="132" y2="284"/>
  <line x1="70" y1="284" x2="136" y2="284"/>
</g>

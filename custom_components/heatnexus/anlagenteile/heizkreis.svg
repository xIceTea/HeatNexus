<!-- Der Koerper ist bewusst neutral gefaerbt.

     Bis 1.4.1 stand hier ein Verlauf von Glut nach Warm - ein
     Heizkoerper, der immer glueht, auch bei 27 Grad Vorlauf. Die Waerme legt
     die Oberflaeche als eigene Ebene darueber (siehe schema.HEIZKOERPER_*),
     und die kann nur so gut sein wie das, was darunter liegt: An den runden
     Enden der Glieder schimmerte das gezeichnete Rot durch.

     Ohne gemessene Vorlauftemperatur bleibt es bei diesem Grau. Das ist
     richtig so - dann wissen wir es schlicht nicht. -->
<defs>
  <linearGradient id="koerper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="{{korpus_hell}}"/>
    <stop offset="100%" stop-color="{{korpus}}"/>
  </linearGradient>
</defs>

<!-- Heizkörper: Sammelrohre oben und unten, Glieder dazwischen -->
<rect x="42" y="132" width="116" height="12" rx="6" fill="{{korpus}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>
<rect x="42" y="266" width="116" height="12" rx="6" fill="{{korpus}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>

<g fill="url(#koerper)" stroke="{{rahmen}}" stroke-width="1">
  <rect x="50" y="140" width="14" height="132" rx="7"/>
  <rect x="72" y="140" width="14" height="132" rx="7"/>
  <rect x="94" y="140" width="14" height="132" rx="7"/>
  <rect x="116" y="140" width="14" height="132" rx="7"/>
  <rect x="138" y="140" width="14" height="132" rx="7"/>
</g>

<!-- Glanzkante, damit die Glieder rund wirken -->
<g fill="#ffffff" opacity="0.16">
  <rect x="53" y="146" width="4" height="120" rx="2"/>
  <rect x="75" y="146" width="4" height="120" rx="2"/>
  <rect x="97" y="146" width="4" height="120" rx="2"/>
  <rect x="119" y="146" width="4" height="120" rx="2"/>
  <rect x="141" y="146" width="4" height="120" rx="2"/>
</g>

<!-- Mischer im Vorlauf: das Stellglied des Kreises.

     Das uebliche Schaltzeichen: drei Dreiecke, die sich in der Mitte treffen -
     zwei im Durchgang, eines zum dritten Weg. Bis 1.3.0-beta.2 stand hier ein
     Kreis mit Kreuz darin; das las sich wie eine Plus-Taste und niemand
     erkannte ein Ventil. -->
<g fill="{{korpus_dunkel}}" stroke="{{rahmen}}" stroke-width="1.5" stroke-linejoin="round">
  <path d="M 86 104 L 86 120 L 100 112 Z"/>
  <path d="M 114 104 L 114 120 L 100 112 Z"/>
  <path d="M 92 126 L 108 126 L 100 112 Z"/>
</g>
<circle cx="100" cy="112" r="2.5" fill="{{titel}}" opacity="0.55"/>

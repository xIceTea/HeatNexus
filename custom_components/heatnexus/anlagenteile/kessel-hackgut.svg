<defs>
  <linearGradient id="gehaeuse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="{{korpus_hell}}"/>
    <stop offset="100%" stop-color="{{korpus_dunkel}}"/>
  </linearGradient>
  <linearGradient id="glutbett" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="{{glut}}"/>
    <stop offset="55%" stop-color="{{glut}}" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="{{glut}}" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Vorratsbehälter über dem Einschub, unten trichterförmig in den Fallschacht -->
<path d="M 6 140 L 38 140 L 38 214 L 28 232 L 16 232 L 6 214 Z"
      fill="{{korpus}}" stroke="{{rahmen}}" stroke-width="2"/>
<rect x="18" y="231" width="8" height="25" fill="{{korpus}}" stroke="{{rahmen}}" stroke-width="2"/>
<!-- Füllstand. Meldet der Kessel ihn, füllt die Oberfläche die markierte Fläche
     und `vorrat` blendet diese Zeichnung aus. -->
<g opacity="{{vorrat}}">
  <path d="M 8 180 L 36 180 L 36 213 L 27 230 L 17 230 L 8 213 Z"
        fill="{{titel}}" opacity="0.16"/>
  <g fill="{{titel}}" opacity="0.5">
    <rect x="12" y="190" width="7" height="5" rx="1"/>
    <rect x="23" y="196" width="8" height="4" rx="1"/>
    <rect x="13" y="204" width="8" height="5" rx="1"/>
    <rect x="24" y="210" width="6" height="5" rx="1"/>
  </g>
</g>
<rect data-vorrat="" x="8" y="142" width="28" height="71" fill="none"/>

<!-- Einschub der Stokerschnecke, von links unten in den Brennraum -->
<g stroke="{{rahmen}}" stroke-width="2" fill="{{korpus}}">
  <path d="M 14 290 L 14 262 L 46 240 L 46 274 Z"/>
</g>
<g stroke="{{titel}}" stroke-width="1.5" opacity="0.25" fill="none">
  <path d="M 20 284 L 40 270"/>
  <path d="M 20 274 L 40 260"/>
</g>

<!-- Kesselkörper -->
<rect x="44" y="120" width="112" height="174" rx="14" fill="url(#gehaeuse)"
      stroke="{{rahmen}}" stroke-width="2"/>

<!-- Bedienteil -->
<rect x="56" y="134" width="88" height="26" rx="6" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1"/>
<rect x="64" y="142" width="44" height="10" rx="5" fill="{{titel}}" opacity="0.25"/>
<circle cx="132" cy="147" r="4" fill="{{glut}}" opacity="0.8"/>

<!-- Wärmetauscher: senkrechte Rauchrohre -->
<g fill="{{korpus_dunkel}}" opacity="0.8">
  <rect x="62" y="172" width="9" height="46" rx="4"/>
  <rect x="80" y="172" width="9" height="46" rx="4"/>
  <rect x="98" y="172" width="9" height="46" rx="4"/>
  <rect x="116" y="172" width="9" height="46" rx="4"/>
  <rect x="134" y="172" width="9" height="46" rx="4"/>
</g>

<!-- Brennraum mit Glutbett -->
<rect x="56" y="230" width="88" height="52" rx="8" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>
<rect x="64" y="244" width="72" height="30" rx="6" fill="url(#glutbett)"/>
<rect x="64" y="268" width="72" height="6" rx="3" fill="{{glut}}"/>

<defs>
  <linearGradient id="gehaeuse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="{{korpus_hell}}"/>
    <stop offset="100%" stop-color="{{korpus_dunkel}}"/>
  </linearGradient>
  <linearGradient id="glutbett" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="{{glut}}"/>
    <stop offset="60%" stop-color="{{glut}}" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="{{glut}}" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Vorratsbehälter links, unten trichterförmig -->
<path d="M 2 140 L 36 140 L 36 250 L 25 274 L 13 274 L 2 250 Z"
      fill="{{korpus}}" stroke="{{rahmen}}" stroke-width="2"/>
<!-- Füllstand -->
<path d="M 4 186 L 34 186 L 34 249 L 24 272 L 14 272 L 4 249 Z"
      fill="{{titel}}" opacity="0.16"/>
<g fill="{{titel}}" opacity="0.5">
  <rect x="10" y="196" width="9" height="4" rx="2"/>
  <rect x="22" y="204" width="9" height="4" rx="2"/>
  <rect x="10" y="214" width="9" height="4" rx="2"/>
  <rect x="21" y="224" width="9" height="4" rx="2"/>
  <rect x="12" y="234" width="9" height="4" rx="2"/>
</g>

<!-- Kesselkörper -->
<rect x="44" y="120" width="112" height="174" rx="14" fill="url(#gehaeuse)"
      stroke="{{rahmen}}" stroke-width="2"/>

<!-- Bedienteil -->
<rect x="56" y="134" width="88" height="26" rx="6" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1"/>
<rect x="64" y="142" width="44" height="10" rx="5" fill="{{titel}}" opacity="0.25"/>
<circle cx="132" cy="147" r="4" fill="{{glut}}" opacity="0.8"/>

<!-- Wärmetauscher -->
<g fill="{{korpus_dunkel}}" opacity="0.8">
  <rect x="62" y="172" width="9" height="46" rx="4"/>
  <rect x="80" y="172" width="9" height="46" rx="4"/>
  <rect x="98" y="172" width="9" height="46" rx="4"/>
  <rect x="116" y="172" width="9" height="46" rx="4"/>
  <rect x="134" y="172" width="9" height="46" rx="4"/>
</g>

<!-- Brennertopf -->
<rect x="56" y="230" width="88" height="52" rx="8" fill="{{korpus_dunkel}}"
      stroke="{{rahmen}}" stroke-width="1.5"/>
<path d="M 80 274 L 120 274 L 114 246 L 86 246 Z" fill="url(#glutbett)"/>
<rect x="80" y="270" width="40" height="6" rx="3" fill="{{glut}}"/>

<!-- Förderschnecke vom Behälter in den Brennertopf -->
<path d="M 25 250 L 25 268 L 56 268" fill="none" stroke="{{rahmen}}" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round"/>

name: Datenpunkt oder Gerät fehlt
description: Ein Wert der Anlage taucht nicht auf oder ist falsch benannt
labels: ["datenpunkt"]
body:
  - type: markdown
    attributes:
      value: |
        Am hilfreichsten ist ein Abzug aus `tools/heatnexus_probe.py`:

        ```
        python tools/heatnexus_probe.py all <IP-der-Anlage>
        ```

        Geht es um eine ganze Anlage statt um einzelne Werte, passt die
        Vorlage **Anlage beisteuern** besser.

        Bitte vorher IP-Adressen und Seriennummern entfernen.
  - type: input
    id: geraet
    attributes:
      label: Gerät oder Funktion
      placeholder: "PuroWIN, Heizkreis, Puffer …"
    validations:
      required: true
  - type: input
    id: oid
    attributes:
      label: OID oder Datenpunkt
      placeholder: "/1/60/0/39/91/0 bzw. 39/91"
  - type: textarea
    id: erwartung
    attributes:
      label: Was der Wert am InfoWIN anzeigt
      description: Bezeichnung, Wert und Einheit, so wie sie am Gerät stehen
    validations:
      required: true
  - type: dropdown
    id: art
    attributes:
      label: Worum geht es
      options:
        - Der Wert fehlt ganz
        - Der Wert ist da, heißt aber falsch
        - Der Wert ist da, Einheit oder Nachkommastellen stimmen nicht
        - Der Wert lässt sich nicht ändern, obwohl er am Gerät änderbar ist
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Auszug aus der Anlagen-Probe
      description: Die Zeile aus `*_datenpunkte.csv` oder der Eintrag aus `*_menus.json`
      render: json

name: Empfang

# Was neu hereinkommt, bekommt sofort eine Antwort – nicht als Ersatz für eine
# echte, sondern damit niemand im Ungewissen wartet und damit die Angaben
# vollständig werden, bevor jemand nachfragen muss.
#
# Zwei Fälle, beide mit eigenem Grund:
#
# * Ein Abzug einer fremden Anlage ist der wertvollste Beitrag zum Projekt –
#   und der einzige, bei dem der Melder ungewollt eigene Daten veröffentlicht.
#   Die Erinnerung an IP, Seriennummer und `neuronId` muss kommen, bevor sie
#   jemand liest.
# * Ideen sammeln sich schneller an, als sie umgesetzt werden. Wonach sich die
#   Reihenfolge richtet, sollte dort stehen, wo die Idee entsteht.

on:
  issues:
    types: [labeled]
  discussion:
    types: [created]

permissions:
  contents: read

jobs:
  anlage:
    name: Hinweis zum Abzug
    if: github.event_name == 'issues' && github.event.label.name == 'anlage'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                'Danke für den Abzug. HeatNexus entsteht an einer einzigen Anlage — über die hinaus wächst es nur, wenn jemand seine eigene beisteuert.',
                '',
                '**Ein Blick in die Dateien lohnt sich, bevor sie hochgehen.** Der Abzug enthält ein paar Angaben, die nicht öffentlich sein müssen:',
                '',
                '- in `*_endpunkte.json` stehen Netzwerkeinstellungen, MAC-Adresse und Seriennummer der Steuerung',
                '- in `*_structure.json` und `*_menus.json` steht die `neuronId` jedes Moduls',
                '- die Dateinamen enthalten die IP-Adresse der Anlage',
                '',
                'Passwörter stehen nicht darin, und für die Auswertung braucht es diese Angaben ohnehin nicht — wer sie ersetzen möchte, tut das am besten vor dem Hochladen.',
                '',
                'Für den Diagnose-Export der Integration gilt das nicht: Dort sind IP-Adresse, Passwort und Seriennummer bereits geschwärzt.',
              ].join('\n'),
            });

  idee:
    name: Hinweis zur Reihenfolge
    if: github.event_name == 'discussion' && github.event.discussion.category.name == 'Ideas'
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Danke für den Vorschlag.',
              '',
              'Wer eine Idee unterstützen möchte, setzt das 👍 bitte **an den ersten Beitrag** und nicht unter einen Kommentar. Daran sehe ich, was am meisten gebraucht wird, und in dieser Reihenfolge arbeite ich die Vorschläge ab.',
              '',
              'Was auf vielen Anlagen etwas ändert, kommt zuerst. Was nur an einer bestimmten Anlage greift, schafft es unter Umständen nicht in die Integration — dann steht hier aber, wie es sich anders lösen lässt. Kommentarlos geschlossen wird nichts.',
              '',
              'Rückfragen, Einwände und andere Vorschläge gehören darunter.',
            ].join('\n');
            await github.graphql(
              `mutation($discussionId: ID!, $body: String!) {
                 addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                   comment { id }
                 }
               }`,
              { discussionId: context.payload.discussion.node_id, body },
            );

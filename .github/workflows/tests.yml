name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
  # Einmal die Woche gegen die neueste Home-Assistant-Fassung, auch ohne Push:
  # Eine Abkündigung fällt so auf, bevor sie im Protokoll eines Nutzers steht.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools

  kommentare:
    name: Kommentarlänge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Die Prüfung braucht den Vergleichsstand, nicht nur den letzten Commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git fetch origin main --depth=50
      - run: python tools/kommentarregel.py --bereich origin/main...HEAD
      - run: python tools/changelogregel.py --bereich origin/main...HEAD
      - run: python tools/importpruefung.py

  pytest:
    name: ${{ matrix.ha == 'fest' && 'pytest' || 'pytest (neueste HA)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # „fest": die Fassung aus requirements_test.txt, gegen die ausgeliefert wird.
        # „neueste": was pip heute findet. Die Tests scheitern an jeder Abkündigung.
        ha: [fest, neueste]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Muss zur Home-Assistant-Fassung passen, gegen die geprüft wird:
          # HA 2026.7 verlangt Python 3.14.
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - name: Neueste Home-Assistant-Fassung
        if: matrix.ha == 'neueste'
        run: |
          pip install -U pytest-homeassistant-custom-component
          # pip nimmt still die neueste Fassung, die zu dieser Python-Fassung passt.
          python - <<'PY'
          import json, urllib.request
          import homeassistant.const as c
          neu = json.load(urllib.request.urlopen("https://pypi.org/pypi/homeassistant/json"))["info"]["version"]
          print(f"Home Assistant {c.__version__}, auf PyPI {neu}")
          if c.__version__ != neu:
              print(f"::warning::Geprüft gegen {c.__version__}, erschienen ist {neu}")
          PY
      # `manifest.json` nennt `frontend` als Abhängigkeit; ohne das Paket
      # `hass_frontend` kommt keine Einrichtung zustande und die Tests des
      # gesamten Einrichtungspfads überspringen sich still. Die Fassung steht
      # in der Home-Assistant-Fassung selbst - fest eingetragen liefe sie ihr
      # beim nächsten Anheben davon.
      - name: Frontend-Paket passend zur Home-Assistant-Fassung
        run: |
          pip install "$(python - <<'PY'
          import json
          from pathlib import Path
          import homeassistant.components.frontend as f
          print(json.loads((Path(f.__file__).parent / "manifest.json").read_text())["requirements"][0])
          PY
          )"
      - run: pytest --cov=custom_components/heatnexus --cov-report=term-missing

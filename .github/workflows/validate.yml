name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Die HACS-Prüfung liest Repository-Angaben über die öffentliche API und
    # kann das erst, wenn das Repository öffentlich ist. Bis dahin würde sie
    # unabhängig vom Inhalt fehlschlagen.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # „brands" lässt sich auf zwei Wegen erfüllen: mit einem Eintrag der
          # Domain im Repository home-assistant/brands oder mit einem eigenen
          # `brand/` im Integrationsverzeichnis. HeatNexus geht den zweiten Weg
          # – die Prüfung läuft deshalb mit.
          #
          # Bis 1.3.0-beta.2 stand hier `ignore: brands` mit genau dieser
          # Begründung, nur gab es das Verzeichnis gar nicht. Die Prüfung war
          # abgeschaltet, die Symbole fehlten, und in HACS blieb das Feld leer.

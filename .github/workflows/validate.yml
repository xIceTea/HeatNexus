name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Die HACS-Prüfung liest Repository-Angaben über die öffentliche API und
    # kann das erst, wenn das Repository öffentlich ist. Bis dahin würde sie
    # unabhängig vom Inhalt fehlschlagen.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # „brands" verlangt einen Eintrag der Domain im Repository
          # home-assistant/brands. Der ist eigenen Integrationen außerhalb des
          # Kerns nicht zugänglich; die Symbole liefert HeatNexus in `brand/`
          # selbst mit.
          ignore: brands
